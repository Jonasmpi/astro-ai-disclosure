name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # This is the status-check name branch protection binds to. Keep it stable:
    # renaming it silently breaks the required check and blocks every PR.
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Must precede setup-node so its `cache: pnpm` can find the pnpm binary.
      # The version comes from the root package.json `packageManager` field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The package's `prepare` script builds dist/ here, which the demo needs
      # in order to resolve the workspace dependency at all.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # Explicit build before typecheck: `astro check` loads the demo's
      # astro.config.ts, which imports the package's dist/ entrypoint.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
