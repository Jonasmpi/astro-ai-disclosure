name: Release

on:
  push:
    branches: [main]

# Never cancel a release mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the version commit and git tags
  pull-requests: write # open and update the "version packages" PR
  id-token: write # mint the OIDC token npm exchanges for publish rights

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Changesets needs full history to work out what changed.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # No registry-url on purpose: it would write an .npmrc pinned to
          # NODE_AUTH_TOKEN, which shadows the OIDC exchange below.

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships a new enough npm,
      # but print it so an unexpected downgrade fails visibly rather than as a
      # confusing auth error.
      - name: Show toolchain
        run: node -v && npm -v && pnpm -v

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # With pending changesets this opens or updates a release PR. Once that PR
      # is merged no changesets remain, so this publishes to npm and tags instead.
      #
      # Publishing is gated on the NPM_PUBLISH_ENABLED repository variable. Until
      # it is set to "true" the `publish` input is empty, which makes the action
      # manage the version PR only and never touch npm. Version bumps and
      # changelogs still accumulate normally; they are published once the npm
      # account is ready. See "Releasing" in the README.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: ${{ vars.NPM_PUBLISH_ENABLED == 'true' && 'pnpm changeset publish' || '' }}
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: npm authenticates via the OIDC token minted from
          # id-token above, against the trusted publisher configured on npmjs.com.
          NPM_CONFIG_PROVENANCE: "true"
